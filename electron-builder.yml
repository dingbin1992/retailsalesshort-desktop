appId: com.retailsaleshort.app
productName: 流向整理工具
copyright: Copyright 2025

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: config
    to: config

win:
  icon: assets/icon.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 流向整理工具

mac:
  icon: assets/icon.png
  artifactName: "${productName}-${version}.${ext}"
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  title: "流向整理工具"

linux:
  icon: assets/icon.png
  artifactName: "${productName}-${version}.${ext}"
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Utility
  maintainer: dingbin1992
