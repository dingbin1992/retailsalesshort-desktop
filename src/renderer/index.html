<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流向整理工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ========== 组件模板 ========== -->
  <template id="year-month-picker-template">
    <div class="input-group">
      <div class="label-row">
        <label>选择年月</label>
        <span class="sys-time">{{ nowTime }}</span>
      </div>
      <div class="input-row year-month-row">
        <select v-model="selectedYear" class="year-select" :disabled="disabled">
          <option value="">请选择年份...</option>
          <option v-for="y in years" :key="y" :value="y">{{ y }}年</option>
        </select>
        <span class="year-month-sep">年</span>
        <select v-model="selectedMonth" class="month-select" :disabled="disabled">
          <option value="">请选择月份...</option>
          <option v-for="m in months" :key="m" :value="m">{{ m }}月</option>
        </select>
        <span class="year-month-sep">月</span>
      </div>
    </div>
  </template>

  <template id="directory-picker-template">
    <div class="input-group">
      <label>{{ label }}</label>
      <div class="input-row">
        <input type="text" :value="modelValue" :placeholder="placeholder" readonly :disabled="disabled">
        <button class="btn-browse" :disabled="disabled" @click="browse">浏览...</button>
      </div>
    </div>
  </template>

  <template id="action-panel-template">
    <section class="action-panel">
      <button class="btn-process" :disabled="isProcessing" @click="$emit('start')">开始处理</button>
      <button class="btn-edit-config" :disabled="isProcessing" @click="$emit('editConfig')">修改配置</button>
      <div class="progress-container" v-show="progress.visible">
        <div class="progress-bar">
          <div class="progress-fill" :style="{ width: progress.percent + '%' }"></div>
        </div>
        <span class="progress-text">{{ progress.text }}</span>
      </div>
    </section>
  </template>


  <template id="user-add-form-template">
    <div class="modal-overlay" @click.self="$emit('cancel')">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2>新增格式规则</h2>
          <button class="modal-close" @click="$emit('cancel')">&times;</button>
        </div>

        <div class="modal-body">
          <!-- 商业单位名称 -->
          <div class="form-group">
            <label>商业单位名称</label>
            <input type="text" v-model="businessUnit" class="form-input" placeholder="请输入商业单位全称...">
            <span v-if="loadingHeaders" class="form-hint">正在读取表头...</span>
          </div>

          <!-- 读取错误提示 -->
          <div v-if="readError" class="form-group">
            <div class="read-error">{{ readError }}</div>
          </div>

          <!-- 表头映射：6 个标准字段，每行用下拉框选 Excel 列 -->
          <div class="form-group">
            <label>原表内表头名称（选择每个标准字段对应的 Excel 列）</label>
            <div class="mapping-table">
              <div class="mapping-row mapping-row-header">
                <span class="mapping-label">标准字段</span>
                <span class="mapping-select-col">原表内表头名称</span>
                <span class="mapping-format-col">格式要求</span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">日期</span>
                <select v-model="mapDate" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">
                  <label class="checkbox-label"><input type="checkbox" v-model="dateShort"> 短日期</label>
                </span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">品种</span>
                <select v-model="mapProduct" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">常规</span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">规格</span>
                <select v-model="mapSpec" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">常规</span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">批号</span>
                <select v-model="mapBatch" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">常规</span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">流向单位</span>
                <select v-model="mapUnit" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">常规</span>
              </div>
              <div class="mapping-row">
                <span class="mapping-label">数量</span>
                <select v-model="mapQuantity" class="form-select mapping-select">
                  <option value="">--- 不映射 ---</option>
                  <option v-for="(h, hi) in excelHeaders" :key="hi" :value="hi + 1">{{ h }}</option>
                </select>
                <span class="mapping-format">数字</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel" @click="$emit('cancel')">取消</button>
          <button class="btn-submit" :disabled="!canSubmit" @click="$emit('submit', formData)">提交</button>
        </div>
      </div>
    </div>
  </template>

  <template id="log-panel-template">
    <section class="log-panel">
      <div class="log-header">
        <span>处理日志</span>
        <button class="btn-clear" @click="$emit('clear')">清空</button>
      </div>
      <div class="log-area" ref="logAreaRef">
        <div v-for="(entry, idx) in entries" :key="idx" :class="'log-entry log-' + entry.type">
          [{{ entry.time }}] {{ entry.message }}
        </div>
      </div>
    </section>
  </template>

  <!-- ========== 应用容器 ========== -->
  <div id="app">
    <div class="container">
      <header>
        <h1>流向整理工具</h1>
        <p class="subtitle">每日网上下载出库汇总</p>
      </header>

      <section class="config-panel">
        <year-month-picker :disabled="isProcessing" ref="yearMonthPickerRef"></year-month-picker>

        <directory-picker
          label="工作目录（Excel文件所在目录）"
          :disabled="isProcessing"
          v-model="workDir"
          placeholder="选择包含 .xls/.xlsx 文件的目录...">
        </directory-picker>

        <directory-picker
          label="输出目录（汇总文件保存位置）"
          :disabled="isProcessing"
          v-model="outputDir"
          placeholder="选择汇总文件输出目录...">
        </directory-picker>
      </section>

      <action-panel
        :is-processing="isProcessing"
        :progress="progress"
        @start="handleStartProcess"
        @edit-config="handleEditConfig">
      </action-panel>

      <section class="unmatched-panel" v-if="hasUnmatched">
        <div class="unmatched-header">
          <span class="unmatched-icon">&#9888;</span>
          <span>以下文件格式未识别，请为每个文件点击"用户自新增"添加格式规则</span>
        </div>
        <div class="unmatched-list">
          <div v-for="(f, idx) in unmatchedFiles" :key="idx" class="unmatched-item-row">
            <span class="unmatched-item">{{ f }}</span>
            <button class="btn-user-add" @click="handleUserAdd(f)">用户自新增</button>
          </div>
        </div>
      </section>

      <!-- 用户自新增表单对话框 -->
      <user-add-form
        v-if="showUserAddForm"
        ref="userAddFormRef"
        :files="unmatchedFiles"
        :initial-file="selectedUserFile"
        :work-dir="workDir"
        @submit="handleFormSubmit"
        @cancel="handleCancelForm">
      </user-add-form>

      <log-panel
        :entries="logEntries"
        @clear="clearLog">
      </log-panel>
    </div>
  </div>

  <!-- ===== 脚本加载（严格按顺序） ===== -->
  <!-- 1. Vue 3 全局构建 -->
  <script src="vue.global.prod.js"></script>
  <!-- 2. Tauri API 桥接（ES module，挂载 window.electronAPI） -->
  <script type="module" src="tauri-bridge.js"></script>
  <!-- 3. 应用入口（ES module，确保 tauri-bridge 先执行） -->
  <script type="module" src="app.js"></script>
</body>
</html>
